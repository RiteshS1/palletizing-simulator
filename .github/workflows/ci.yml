# CI/CD for the whole project.
#
#   core (Linux + macOS) ─┐
#   sanitizers (ASan)  ───┼─▶ web (engine → WASM → lint → types → Vitest → build → Playwright) ─▶ deploy (Vercel, main only)
#   ros2 (Docker)      ───┘
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/.vcpkg

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Build tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y ninja-build pkg-config;
          else brew install ninja pkgconf || true; fi
      - name: vcpkg (pinned to the manifest baseline)
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$(jq -r '."builtin-baseline"' core/vcpkg.json)"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Cache compiled dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-release-${{ hashFiles('core/vcpkg.json') }}
      - name: Configure + build (CMake preset)
        working-directory: core
        run: cmake --preset release && cmake --build --preset release
      - name: Unit + property tests (GoogleTest via CTest)
        working-directory: core
        run: ctest --preset release
      - name: Algorithm benchmark (smoke run)
        run: ./core/build/release/bench --seeds 5

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config
      - name: vcpkg
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$(jq -r '."builtin-baseline"' core/vcpkg.json)"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-asan-${{ hashFiles('core/vcpkg.json') }}
      - name: AddressSanitizer + UndefinedBehaviorSanitizer
        working-directory: core
        run: cmake --preset debug-asan && cmake --build --preset debug-asan && ctest --preset debug-asan

  ros2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the ROS 2 Jazzy workspace (colcon, in Docker)
        run: scripts/ros.sh build
      - name: ROS 2 tests (gtest + launch_testing service call)
        run: scripts/ros.sh test

  web:
    needs: [core, sanitizers, ros2]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config
        working-directory: .
      - name: vcpkg
        working-directory: .
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$(jq -r '."builtin-baseline"' core/vcpkg.json)"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-web-${{ hashFiles('core/vcpkg.json') }}
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Engine (C++ plans + WebAssembly)
        run: npm run engine
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm test
      - name: Production build
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright, English + Japanese, desktop + phone, axe)
        run: npm run test:e2e
      - name: Keep the engine output for the deploy job
        uses: actions/upload-artifact@v7
        with:
          name: engine
          path: |
            web/public/data
            web/public/wasm
      - name: Upload the test report if something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report

  # Continuous deployment to Vercel, only from main and only after every test passed.
  # Needs the VERCEL_TOKEN secret plus the VERCEL_ORG_ID / VERCEL_PROJECT_ID variables.
  deploy:
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Skip when Vercel is not configured yet
        id: check
        working-directory: .
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::Vercel secrets not set; skipping deploy";
          else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v7
        if: steps.check.outputs.ready == 'true'
      - uses: actions/download-artifact@v8
        if: steps.check.outputs.ready == 'true'
        with:
          name: engine
          path: web/public
      - uses: actions/setup-node@v7
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.check.outputs.ready == 'true'
        run: npm ci && npm i -g vercel@66
      - name: Build with Vercel (prebuilt), then deploy
        id: deploy
        if: steps.check.outputs.ready == 'true'
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
