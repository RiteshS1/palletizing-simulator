# CI/CD for the whole project.
#
#   core (Linux + macOS) ─┬─▶ web (engine → WASM → site → e2e) ──▶ deploy (main only)
#   sanitizers (ASan)  ───┤
#   ros2 (Docker)      ───┘
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/.vcpkg

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Build tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y ninja-build pkg-config;
          else brew install ninja pkgconf || true; fi
      - name: vcpkg (pinned to the manifest baseline)
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$(jq -r '."builtin-baseline"' core/vcpkg.json)"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Cache compiled dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-release-${{ hashFiles('core/vcpkg.json') }}
      - name: Configure + build (CMake preset)
        working-directory: core
        run: cmake --preset release && cmake --build --preset release
      - name: Unit + property tests (GoogleTest via CTest)
        working-directory: core
        run: ctest --preset release
      - name: Algorithm benchmark (smoke run)
        run: ./core/build/release/bench --seeds 5

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config
      - name: vcpkg
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$(jq -r '."builtin-baseline"' core/vcpkg.json)"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-asan-${{ hashFiles('core/vcpkg.json') }}
      - name: AddressSanitizer + UndefinedBehaviorSanitizer
        working-directory: core
        run: cmake --preset debug-asan && cmake --build --preset debug-asan && ctest --preset debug-asan

  ros2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the ROS 2 Jazzy workspace (colcon, in Docker)
        run: scripts/ros.sh build
      - name: ROS 2 tests (gtest + launch_testing service call)
        run: scripts/ros.sh test

  web:
    needs: [core, sanitizers, ros2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config
      - name: vcpkg
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$(jq -r '."builtin-baseline"' core/vcpkg.json)"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-web-${{ hashFiles('core/vcpkg.json') }}
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Build the site (C++ plans + WebAssembly + web build)
        run: npm run build
        working-directory: web
      - name: End-to-end tests
        run: npm run test:e2e
        working-directory: web
      - name: Keep the site for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
      - name: Upload the test report if something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report

  deploy:
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
